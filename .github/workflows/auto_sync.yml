name: Update M3U Playlist

on:
  schedule:
    # প্রতিদিন রাত ১২:০০ টায় (UTC) একবার স্বয়ংক্রিয়ভাবে চলবে (২৪ ঘণ্টায় একবার)
    - cron: '0 0 * * *'
  workflow_dispatch: # এটি যুক্ত করায় আপনি Actions ট্যাব থেকে ম্যানুয়ালি রান করতে পারবেন

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ফাইলে পরিবর্তন পুশ করার অনুমতি

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Process and Generate Playlist
        run: |
          python process.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist [skip ci]" && git push)
